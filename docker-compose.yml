services:
  mysql:
    image: mysql:8.0
    container_name: calcflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: calcflow
      MYSQL_USER: calcflow_user
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
